<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Click The Fly</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Menu Screen -->
        <div class="screen screen-active" id="menu">
            <div class="menu-content">
                <h1>🪰 CLICK THE FLY</h1>
                <p>Klicke auf die Fliege!</p>
                
                <div class="difficulty-select">
                    <button class="btn-difficulty" data-difficulty="easy">Easy (30s)</button>
                    <button class="btn-difficulty" data-difficulty="medium">Medium (20s)</button>
                    <button class="btn-difficulty" data-difficulty="hard">Hard (10s)</button>
                </div>

                <div class="best-score">
                    Best: <span id="best">0</span>
                </div>
            </div>
        </div>

        <!-- Game Screen -->
        <div class="screen" id="game">
            <div class="game-top">
                <div class="score-box">Score: <span id="score">0</span></div>
                <div class="timer-box">Zeit: <span id="timer">30</span>s</div>
                <button class="btn-menu-small" id="exit-btn">✕</button>
            </div>
            
            <div class="game-field" id="field"></div>
            
            <div class="game-bottom">
                <button class="btn-pause" id="pause-btn">⏸ Pause</button>
            </div>
        </div>

        <!-- Pause Screen -->
        <div class="screen" id="pause">
            <div class="pause-box">
                <h2>⏸ PAUSIERT</h2>
                <p>Score: <strong id="pause-score">0</strong></p>
                <p>Zeit: <strong id="pause-time">0</strong>s</p>
                <div class="pause-buttons">
                    <button class="btn btn-primary" id="resume-btn">Fortsetzen</button>
                    <button class="btn btn-secondary" id="pause-menu-btn">Menü</button>
                </div>
            </div>
        </div>

        <!-- Game Over Screen -->
        <div class="screen" id="gameover">
            <div class="gameover-box">
                <h2>🎮 SPIEL VORBEI</h2>
                <div class="result">
                    <p>Score: <span id="final-score">0</span></p>
                    <p>Best: <span id="final-best">0</span></p>
                    <p id="record" class="record-msg" style="display:none;">🏆 NEUER REKORD! 🏆</p>
                </div>
                <button class="btn btn-primary" id="replay-btn">Nochmal</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
