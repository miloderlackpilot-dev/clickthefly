<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Click The Fly</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Menu -->
    <div id="menu" class="screen active">
        <div class="menu-box">
            <h1>🪰 CLICK THE FLY</h1>
            <p>Klicke auf die Fliege!</p>
            
            <button class="btn-diff" onclick="game.selectDifficulty('easy')">
                🟢 Easy (30s)
            </button>
            <button class="btn-diff" onclick="game.selectDifficulty('medium')">
                🟡 Medium (20s)
            </button>
            <button class="btn-diff" onclick="game.selectDifficulty('hard')">
                🔴 Hard (10s)
            </button>

            <div class="best">Best: <span id="best-score">0</span></div>
        </div>
    </div>

    <!-- Confirm -->
    <div id="confirm" class="screen">
        <div class="confirm-box">
            <h2>Bereit?</h2>
            <p>Schwierigkeit: <strong id="confirm-diff">Easy</strong></p>
            <button class="btn-yes" onclick="game.startGame()">🎮 JA, START!</button>
            <button class="btn-no" onclick="game.backToMenu()">❌ NEIN</button>
        </div>
    </div>

    <!-- Game -->
    <div id="game-screen" class="screen">
        <div class="game-top">
            <div class="info">Score: <span id="score">0</span></div>
            <div class="info">Zeit: <span id="timer">30</span>s</div>
            <button class="btn-exit" onclick="game.backToMenu()">✕</button>
        </div>
        <div id="field" class="game-field"></div>
    </div>

    <!-- Game Over -->
    <div id="gameover" class="screen">
        <div class="result-box">
            <h2>SPIEL VORBEI!</h2>
            <p>Score: <strong id="final-score">0</strong></p>
            <p>Best: <strong id="final-best">0</strong></p>
            <p id="new-record" class="record" style="display:none;">🏆 NEUER REKORD!</p>
            <button class="btn-replay" onclick="game.backToMenu()">🎮 NOCHMAL</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
